name: Build AUTO FISH APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          unzip -q AUTO_FISH_AndroidStudio_Project.zip -d source

      - name: Build APK
        run: gradle -p source/AutoFishAndroid assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AUTO-FISH-APK
          path: source/AutoFishAndroid/app/build/outputs/apk/debug/*.apk
